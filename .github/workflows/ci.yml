name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8
  TFLINT_VERSION: v0.53.0

jobs:
  terraform-static:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/envs/dev init -backend=false -input=false
      - run: terraform -chdir=terraform/envs/dev validate
      - run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

  plan-localstack:
    name: terraform plan vs LocalStack
    runs-on: ubuntu-latest
    needs: terraform-static
    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: s3,kms,iam,sts,glue,athena
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      # Dummy credentials accepted by LocalStack. No real AWS access in CI.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=terraform/envs/dev init -backend=false -input=false
      - run: terraform -chdir=terraform/envs/dev plan -input=false -lock=false -var use_localstack=true

  python:
    name: ruff + pytest (PySpark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check glue_jobs scripts tests
      - run: ruff format --check glue_jobs scripts tests
      - run: pytest
        env:
          ICEBERG_IT: "1"
